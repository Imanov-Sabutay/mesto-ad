<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Mesto</title>
    <link rel="dns-prefetch" href="https://mesto.nomoreparties.co" />
    <link rel="preconnect" href="https://mesto.nomoreparties.co" />
    <link rel="stylesheet" href="./src/pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./src/images/logo.svg"
          alt="Логотип проекта место"
          class="logo header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__image"></div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button class="profile__edit-button" type="button"></button>
            <p class="profile__description"></p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>
        <section class="places page__section">
          <ul class="places__list places__list_loading">
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
            <li class="places__item card card_skeleton" aria-hidden="true">
              <div class="card__image card__image_skeleton"></div>
              <div class="card__description">
                <h2 class="card__title card__title_skeleton"></h2>
              </div>
            </li>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Mesto Russia</p>
      </footer>

      <div class="popup popup_type_edit">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Редактировать профиль</h3>
          <form class="popup__form" name="edit-profile" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="user-name"
                id="user-name"
                class="popup__input popup__input_type_name"
                placeholder="Имя"
                minlength="2"
                maxlength="40"
                pattern="[a-zA-Zа-яА-ЯёЁ\s\-]+"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
                required
              />
              <span class="popup__error" id="user-name-error"></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="user-description"
                id="user-description"
                class="popup__input popup__input_type_description"
                placeholder="Занятие"
                minlength="2"
                maxlength="200"
                required
              />
              <span class="popup__error" id="user-description-error"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_new-card">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Новое место</h3>
          <form class="popup__form" name="new-place" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="place-name"
                id="place-name"
                class="popup__input popup__input_type_card-name"
                placeholder="Название"
                minlength="2"
                maxlength="30"
                pattern="[a-zA-Zа-яА-ЯёЁ\s\-]+"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
                required
              />
              <span class="popup__error" id="place-name-error"></span>
            </label>
            <label class="popup__label">
              <input
                type="url"
                name="place-link"
                id="place-link"
                class="popup__input popup__input_type_url"
                placeholder="Ссылка на картинку"
                required
              />
              <span class="popup__error" id="place-link-error"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Создать
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_image">
        <div class="popup__content popup__content_content_image">
          <button type="button" class="popup__close"></button>
          <img src="" alt="" class="popup__image" />
          <p class="popup__caption"></p>
        </div>
      </div>

      <div class="popup popup_type_remove-card">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Вы уверены?</h3>
          <form class="popup__form" name="remove-card" novalidate>
            <button type="submit" class="button popup__button">Да</button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_edit-avatar">
        <div class="popup__content">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title">Обновить аватар</h3>
          <form class="popup__form" name="edit-avatar" novalidate>
            <label class="popup__label">
              <input
                type="url"
                name="user-avatar"
                id="user-avatar"
                class="popup__input popup__input_type_avatar"
                placeholder="Ссылка на изображение"
                required
              />
              <span class="popup__error" id="user-avatar-error"></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>

      <div class="popup popup_type_info">
        <div class="popup__content popup__content_content_info">
          <button type="button" class="popup__close"></button>
          <h3 class="popup__title"></h3>
          <dl class="popup__info"></dl>
          <h4 class="popup__text"></h4>
          <ul class="popup__list"></ul>
        </div>
      </div>
    </div>

    <template id="card-template">
      <li class="places__item card">
        <img class="card__image" src="" alt="" />
        <div class="card__control">
          <button type="button" class="card__control-button card__control-button_type_info"></button>
          <button type="button" class="card__control-button card__control-button_type_delete"></button>
        </div>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <div class="card__likes">
            <button type="button" class="card__like-button"></button>
            <p class="card__like-count"></p>
          </div>
        </div>
      </li>
    </template>

    <template id="popup-info-definition-template">
      <div class="popup__info-item">
        <dt class="popup__info-term"></dt>
        <dd class="popup__info-description"></dd>
      </div>
    </template>

    <template id="popup-info-user-preview-template">
      <li class="popup__list-item popup__list-item_type_badge"></li>
    </template>

    <script>
      (function () {
        var storageKey = "mesto-app-data";

        try {
          var storedData = localStorage.getItem(storageKey);

          if (!storedData) {
            return;
          }

          var parsedData = JSON.parse(storedData);
          var userData = parsedData.userData;
          var cards = parsedData.cards;

          if (!userData || !userData._id || !Array.isArray(cards)) {
            return;
          }

          var paintCachedData = function () {
            var profileTitle = document.querySelector(".profile__title");
            var profileDescription = document.querySelector(".profile__description");
            var profileAvatar = document.querySelector(".profile__image");
            var placesList = document.querySelector(".places__list");
            var cardTemplate = document.getElementById("card-template");

            if (!profileTitle || !placesList || !cardTemplate) {
              return;
            }

            profileTitle.textContent = userData.name;
            profileDescription.textContent = userData.about;
            profileAvatar.style.backgroundImage = "url(" + userData.avatar + ")";

            var cardFragment = document.createDocumentFragment();

            cards.forEach(function (cardData) {
              var cardElement = cardTemplate.content
                .querySelector(".card")
                .cloneNode(true);
              var cardImage = cardElement.querySelector(".card__image");
              var likeButton = cardElement.querySelector(".card__like-button");
              var deleteButton = cardElement.querySelector(
                ".card__control-button_type_delete"
              );

              cardElement.dataset.cardId = cardData._id;
              cardImage.decoding = "async";
              cardImage.src = cardData.link;
              cardImage.alt = cardData.name;
              cardElement.querySelector(".card__title").textContent = cardData.name;
              cardElement.querySelector(".card__like-count").textContent =
                String(cardData.likes.length);

              if (
                cardData.likes.some(function (user) {
                  return user._id === userData._id;
                })
              ) {
                likeButton.classList.add("card__like-button_is-active");
              }

              if (cardData.owner._id !== userData._id) {
                deleteButton.remove();
              }

              cardFragment.append(cardElement);
            });

            placesList.classList.remove("places__list_loading");
            placesList.replaceChildren();
            placesList.append(cardFragment);
            window.__mestoCachePainted = true;
          };

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", paintCachedData);
          } else {
            paintCachedData();
          }
        } catch (error) {
          console.log(error);
        }
      })();
    </script>

    <script type="module" src="/src/scripts/index.js"></script>
  </body>
</html>
